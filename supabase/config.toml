project_id = "coco-crm"

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]
enable_signup = false
minimum_password_length = 8

[functions.create-advisor]
# The handler validates the user's JWT with Auth and checks their database role.
# The legacy gateway does not accept modern asymmetric signing keys.
verify_jwt = false
entrypoint = "./functions/create-advisor/index.js"

[functions.check-dni]
verify_jwt = false
entrypoint = "./functions/check-dni/index.js"
